# 必须与微信会话列表里显示的群名完全一致，建议先给群设置一个唯一备注。
group_name: ""
timezone: "Asia/Shanghai"

collector:
  # 只调用 WeChatDataAnalysis 的本机只读聊天接口。
  driver: "wechat_data_analysis"
  wda_base_url: "http://127.0.0.1:10392"
  # 留空时使用默认微信账号；多账号时填写 WeChatDataAnalysis 返回的账号 ID。
  wda_account: ""
  # 留空时按 group_name 精确查找；若存在同名群，请填写 xxx@chatroom。
  wda_session_id: ""
  # auto 优先读取当前微信数据库；也可改成 decrypted 使用已解密快照。
  wda_source: "auto"
  wda_page_size: 500
  wda_timeout_seconds: 60
  lookback_hours: 48
  poll_seconds: 300
  retry_seconds: 60

keywords:
  force_include:
    - "#重要"
    - "#阻塞"
    - "#必须修复"
    - "[P0]"
    - "[P1]"

llm:
  base_url: "https://api.deepseek.com"
  api_key_env: "LLM_API_KEY"
  model: "deepseek-flash"
  timeout_seconds: 120
  max_chunk_characters: 24000

schedule:
  hour: 10
  minute: 0
  failed_retry_minutes: 60

storage:
  database_path: "data/agent.db"
  report_dir: "reports"
  log_path: "logs/agent.log"

privacy:
  # 开启后，发送人在数据库和报表中保存为不可逆短哈希。
  hash_senders: false
  sender_hash_salt_env: "SENDER_HASH_SALT"

feishu:
  # 启用后，analyze 和每天的自动任务会在生成 Excel 后同步新问题。
  enabled: false
  app_id_env: "FEISHU_APP_ID"
  app_secret_env: "FEISHU_APP_SECRET"
  # 多维表格链接中 /base/ 后面的值。
  app_token: ""
  # 多维表格链接的 table 参数。
  table_id: ""
  # 可选：链接的 view 参数；设置后记录序号与该视图顺序一致。
  view_id: ""
  timeout_seconds: 30
  # 默认匹配“日期、优先级、问题标题、问题分类”等报表字段。
  # 自定义列名时，左侧填写程序字段，右侧填写飞书表格字段名。
  field_mapping:
    # title: "缺陷名称"
    # priority: "严重程度"
    # description: "缺陷描述"

github_issues:
  # 读取飞书低严重度记录，结合本地历史仓库评估后创建 GitHub Issue。
  enabled: false
  token_env: "GITHUB_TOKEN"
  organization: "HarnessApex"
  repositories_root: "E:/workspace/HarnessApex"
  # 留空表示使用本地目录中远程属于该组织的全部仓库。
  repository_allowlist: []
  severity_field: "严重程度"
  severity_values:
    - "一般"
    - "轻微"
  title_field: "问题标题"
  # 已经处理完成的记录不再调用模型或创建 Issue。
  status_field: "状态"
  ignored_status_values:
    - "已修复"
    - "已回归"
  # 必须能定位真实文件并达到此置信度，才会进入提单流程。
  min_confidence: 0.82
  # 防止一次运行创建过多 Issue。
  max_issues_per_run: 3
  max_repository_context_characters: 30000
  # 首次使用保持 true；确认结果后改为 false 才会由定时任务真实提单。
  dry_run: true

